<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>雨后站台 · 星桥娱乐设计样张</title>
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body>
    <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="grid" viewBox="0 0 24 24"><path d="M3.5 4h7v7h-7zM13.5 4h7v7h-7zM3.5 14h7v7h-7zM13.5 14h7v7h-7z"/></symbol>
      <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5.5C3 4.7 3.7 4 4.5 4H10l2 2h7.5c.8 0 1.5.7 1.5 1.5V19H3z"/></symbol>
      <symbol id="stack" viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="rows" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.5M3 12h.5M3 18h.5"/></symbol>
      <symbol id="switch" viewBox="0 0 24 24"><path d="M3 7h16m-4-4 4 4-4 4M21 17H5m4-4-4 4 4 4"/></symbol>
      <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
      <symbol id="frame" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 8h2m9 7h-2"/></symbol>
      <symbol id="compare" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M12 3v18"/></symbol>
      <symbol id="slate" viewBox="0 0 24 24"><path d="M3 9h18v11H3zm0 0 17-4-1-3L2 6zM7 5l3 2m3-3 3 2"/></symbol>
      <symbol id="sound" viewBox="0 0 24 24"><path d="M3 10v4m4-7v10m5-13v16m5-13v10m4-7v4"/></symbol>
      <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
      <symbol id="time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
    </svg>
    <header class="top">
      <a class="brand" href="studio.html?view=projects" aria-label="星桥娱乐作品项目">
        <img src="assets/brand.svg" alt="" width="33" height="33" />
        <span>星桥娱乐<small>STARBRIDGE STUDIO</small></span>
      </a>
      <nav class="crumbs" aria-label="面包屑"><a href="studio.html?view=projects">创作工作台</a><span>/</span><span id="crumb"></span></nav>
      <a class="switch" href="launch.html"><svg class="icon"><use href="#switch"/></svg>切换系统</a>
      <span class="avatar" aria-label="娱乐创作者">创</span>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <span class="side-label">创作工作台</span>
        <nav class="menu" aria-label="创作工作台"><a href="studio.html?view=projects" aria-current="location"><svg class="icon"><use href="#folder"/></svg>作品项目</a><span><svg class="icon"><use href="#stack"/></svg>素材库</span><span><svg class="icon"><use href="#rows"/></svg>制作任务</span></nav>
        <div class="recent"><span class="side-label">最近作品</span><a href="studio.html"><img src="assets/shot-1.webp" alt=""/><span>雨后站台</span></a></div>
        <footer class="side-foot"><span class="point"></span>娱乐创作者</footer>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
    <script>
      const icon = (name) => '<svg class="icon" aria-hidden="true"><use href="#' + name + '"/></svg>'
      // 所有作品字段均是样例。采用候选只修改当前样张，不请求真实工程和模型。
      const shots = [
        { title: '站台全景', duration: 4, time: '00:00', frame: '全景', camera: '固定镜头', scene: '车站外景', role: '站台广播', line: '末班车即将进站。', ref: '站台外景' },
        { title: '时刻表与车票', duration: 3, time: '00:04', frame: '特写', camera: '缓慢推近', scene: '候车区', role: '旁白', line: '', ref: '纸质车票' },
        { title: '雨棚中景', duration: 5, time: '00:07', frame: '中景', camera: '缓慢推近', scene: '站台雨棚', role: '旁白', line: '雨声停在屋檐下。', ref: '雨棚与站牌' },
        { title: '远去的空车', duration: 4, time: '00:12', frame: '远景', camera: '固定镜头', scene: '街道远端', role: '旁白', line: '', ref: '末班车车窗' },
      ]
      const params = new URLSearchParams(location.search)
      const view = ['projects','timeline'].includes(params.get('view')) ? params.get('view') : 'storyboard'
      const projectName = '雨后站台'
      let selected = Math.max(0, Math.min(3, (Number(params.get('shot')) || 3) - 1))
      let adopted = 0
      try { adopted = sessionStorage.getItem('starbridge.design.rain-platform.take') === 'rain' ? 1 : 0 } catch {}
      // 新候选在检查器中预览，只有“采用”才会改变下方剪辑序列。
      let preview = view === 'storyboard' && selected === 2 ? 1 : (selected === 2 ? adopted : 0)
      let comparing = false
      const two = (value) => String(value).padStart(2,'0')
      const imagePath = (index, take = 0) => index === 2 && take === 1 ? 'assets/shot-rain.webp' : 'assets/shot-' + (index + 1) + '.webp'
      const selectedTake = () => selected === 2 ? adopted : 0
      const img = (index, take, alt) => '<img src="' + imagePath(index,take) + '" alt="' + alt + '" draggable="false"/>'
      const source = (take) => take ? '雨夜版' : '原版'
      const boardURL = () => 'studio.html?shot=' + (selected + 1)
      const timelineURL = () => 'studio.html?view=timeline&shot=' + (selected + 1)
      const announce = (message) => { document.getElementById('announcement').textContent = message }
      function topHeading() {
        return '<div class="work-head"><div><h1>' + projectName + '</h1><p>剧情短片 <i></i> 4 个镜头 <i></i> 16 秒 <i></i> 2 路配音</p></div><span class="revision">' + icon('stack') + '工程修订 7</span></div>'
      }
      function tabs() {
        return '<nav class="work-tabs" aria-label="作品内导航"><span>剧本与导演</span><span>项目素材</span><a href="' + boardURL() + '"' + (view === 'storyboard' ? ' aria-current="page"' : '') + '>分镜板</a><a href="' + timelineURL() + '"' + (view === 'timeline' ? ' aria-current="page"' : '') + '>剪辑时间线</a><span>制作任务</span></nav>'
      }
      function shotList() {
        return '<section class="shot-rail" aria-label="分镜序列"><div class="section-cap"><h2>分镜序列</h2><span class="count">04</span></div><div class="shots">' + shots.map((shot,index) => '<button type="button" data-shot="' + index + '" class="shot' + (selected === index ? ' selected' : '') + '" aria-pressed="' + (selected === index) + '"><span class="thumb">' + img(index,index === 2 ? adopted : 0,'') + '<b>' + two(index + 1) + '</b></span><span class="shot-text"><strong>' + shot.title + '</strong><small>' + shot.frame + ' <span>·</span> ' + shot.duration + 's</small></span></button>').join('') + '</div></section>'
      }
      function choices() {
        const list = selected === 2 ? [0,1] : [0]
        return '<section class="take-section"><div class="section-cap"><h2>镜头候选</h2><span class="count">' + two(list.length) + '</span><span class="section-end">镜 ' + two(selected + 1) + '</span></div><div class="takes">' + list.map(take => '<button class="take' + (preview === take ? ' selected' : '') + '" type="button" data-take="' + take + '" aria-pressed="' + (preview === take) + '"><span class="take-image">' + img(selected,take,'') + '</span><span><strong>' + source(take) + '</strong><small>' + (take === selectedTake() ? '<em></em>已采用' : '待采用') + '</small></span></button>').join('') + '</div></section>'
      }
      function monitor() {
        const shot = shots[selected]
        const alternate = view === 'storyboard' && selected === 2 && comparing
        let picture = alternate
          ? [0,1].map(take => '<div class="split-frame">' + img(selected,take,shot.title + '，' + source(take)) + '<b>' + source(take) + '</b></div>').join('')
          : img(selected,preview, shot.title + '，' + source(preview))
        return '<section class="monitor"><div class="monitor-bar"><strong>' + icon('frame') + '镜头预览</strong><span class="mono">16:9</span></div><div class="picture' + (alternate ? ' split' : '') + '">' + picture + '<span class="frame-no">SH ' + two(selected + 1) + '</span></div><div class="monitor-foot"><span><b>' + shot.time + '</b> <span class="divide">/</span> 00:16</span>' + (view === 'storyboard' && selected === 2 ? '<button type="button" class="compare" data-compare aria-pressed="' + comparing + '">' + icon('compare') + (comparing ? '退出对比' : '对比候选') + '</button>' : '<span class="monitor-format">首帧</span>') + '</div></section>'
      }
      function inspector() {
        const shot = shots[selected]
        return '<aside class="inspector"><div class="section-cap"><h2>镜头详情</h2><span class="section-end mono">SH ' + two(selected+1) + '</span></div><div class="inspect-content"><div class="shot-title"><span class="kicker">镜 ' + two(selected+1) + '</span><h2>' + shot.title + '</h2></div><dl class="facts"><div><dt>景别</dt><dd>' + shot.frame + '</dd></div><div><dt>时长</dt><dd class="mono">' + shot.duration.toFixed(1) + ' s</dd></div><div><dt>运镜</dt><dd>' + shot.camera + '</dd></div><div><dt>场景</dt><dd>' + shot.scene + '</dd></div></dl><div class="props"><h3>参考素材</h3><div class="chips"><span>' + shot.role + ' · 音色</span><span>' + shot.ref + '</span></div></div><div class="dialogue"><h3>台词与配音</h3>' + (shot.line ? '<p>“' + shot.line + '”</p><small>' + icon('sound') + shot.role + ' <i></i> ' + (shot.role === '旁白' ? '音色 A' : '音色 B') + '</small>' : '<p class="empty">本镜无台词</p>') + '</div><div class="adoption"><small>当前时间线</small><strong>' + icon('check') + source(selectedTake()) + '</strong>' + (selected === 2 ? '<button class="action" type="button" data-adopt' + (preview === adopted ? ' disabled' : '') + '>' + icon(preview === adopted ? 'check' : 'slate') + (preview === adopted ? '已采用此候选' : '采用' + source(preview)) + '</button>' : '') + '</div></div></aside>'
      }
      function sequence() {
        return '<section class="sequence"><div class="sequence-head"><h2>' + icon('slate') + '剪辑序列</h2><a href="' + timelineURL() + '">进入时间线 ' + icon('arrow') + '</a></div><div class="filmstrip">' + shots.map((s,i) => '<button data-shot="' + i + '" class="' + (i === selected ? 'selected' : '') + '" style="--duration:' + s.duration + '" aria-label="查看镜 ' + (i+1) +'"><div>' + img(i,i === 2 ? adopted : 0,'') + '</div><span>' + two(i+1) + ' <small>' + s.time + '</small></span></button>').join('') + '</div></section>'
      }
      function board() {
        return topHeading() + tabs() + '<div class="board">' + shotList() + '<div class="center">' + monitor() + choices() + '</div>' + inspector() + '</div>' + sequence()
      }
      function editorTimeline() {
        const label = '<div class="track-labels"><b>轨道</b><span>画面</span><span>逐句配音</span><span>字幕</span><span>背景音乐</span></div>'
        const cells = (type) => shots.map((s,i) => '<div class="clip '+type+(i===selected?' highlighted':'')+'" style="--duration:'+s.duration+'">' + (type === 'video' ? '<button type="button" data-shot="'+i+'">' + img(i,i===2?adopted:0,'') + '<b>镜 ' + two(i+1) + ' · ' + s.title + '</b></button>' : (s.line ? '<span>'+ (type==='voice' ? s.role : s.line) +'</span>':'')) + '</div>').join('')
        return topHeading() + tabs() + '<div class="timeline-main"><div class="timeline-screen">' + monitor() + '</div><aside class="timeline-info"><span class="kicker">镜 ' + two(selected+1) + '</span><h2>' + shots[selected].title + '</h2><p>采用' + source(selectedTake()) + ' · ' + shots[selected].duration + ' 秒</p><a href="' + boardURL() + '">返回分镜板 '+icon('arrow')+'</a></aside></div><section class="timeline"><div class="sequence-head"><h2>' + icon('slate') + '剪辑时间线</h2><span class="mono">00:00 — 00:16</span></div><div class="tracks">' + label + '<div class="track-data"><div class="ruler">' + ['00:00','00:04','00:08','00:12','00:16'].map(s => '<span>'+s+'</span>').join('') + '</div><div class="track">'+cells('video')+'</div><div class="track">'+cells('voice')+'</div><div class="track">'+cells('subtitle')+'</div><div class="track music"><span>未添加背景音乐</span></div></div></div></section>'
      }
      function directory() {
        return '<div class="work-head"><div><h1>作品项目</h1><p>1 个作品</p></div></div><div class="project-tools"><label>' + icon('search') + '<input type="search" aria-label="搜索作品" placeholder="搜索作品名称" id="search"/></label></div><article class="feature" id="project"><a class="feature-picture" href="studio.html">' + img(0,0,projectName + '的示例封面') + '<span class="feature-mark">' + icon('slate') + '剧情短片</span></a><div class="feature-info"><div><h2>' + projectName + '</h2><p>4 个镜头 <i></i> 4 个已采用 <i></i> 16 秒</p></div><a class="action" href="studio.html">进入作品 ' + icon('arrow') + '</a></div></article><p id="no-project" hidden>没有匹配的作品。</p>'
      }
      function render() {
        document.getElementById('main').innerHTML = view === 'projects' ? directory() : view === 'timeline' ? editorTimeline() : board()
        document.getElementById('crumb').textContent = view === 'projects' ? '作品项目' : projectName
      }
      render()
      document.getElementById('main').addEventListener('click', event => {
        const button = event.target.closest('button')
        if (!button) return
        let focus
        if ('shot' in button.dataset) {
          selected = Number(button.dataset.shot)
          preview = selectedTake()
          comparing = false
          const url = new URL(location.href)
          url.searchParams.set('shot',selected+1)
          history.replaceState(null,'',url)
          focus = '[data-shot="'+selected+'"]'
          announce('镜 ' + two(selected + 1) + '，' + shots[selected].title)
        } else if ('take' in button.dataset) {
          preview = Number(button.dataset.take)
          comparing = false
          focus = '[data-take="'+preview+'"]'
          announce('预览' + source(preview))
        } else if ('compare' in button.dataset) {
          comparing = !comparing
          focus = '[data-compare]'
        } else if ('adopt' in button.dataset) {
          adopted = preview
          try { sessionStorage.setItem('starbridge.design.rain-platform.take',adopted ? 'rain' : 'original') } catch {}
          focus = '[data-take="'+adopted+'"]'
          announce('镜 03 已采用' + source(adopted) + '，剪辑时间线已更新')
        } else return
        render()
        document.querySelector(focus)?.focus({preventScroll:true})
      })
      document.getElementById('main').addEventListener('input',event => {
        if (event.target.id !== 'search') return
        const found = projectName.includes(event.target.value.trim())
        document.getElementById('project').hidden = !found
        document.getElementById('no-project').hidden = found
      })
    </script>
  </body>
</html>
