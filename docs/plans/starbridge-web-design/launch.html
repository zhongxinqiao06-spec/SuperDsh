<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>选择工作台 · 星桥</title>
    <link rel="stylesheet" href="website.css" />
  </head>
  <body class="launch">
    <svg class="icon-sheet" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
      <symbol id="bridge" viewBox="0 0 256 256"><path d="M46 188v-43c0-40 30-70 70-70s70 30 70 70v43h-22v-43c0-27-21-48-48-48s-48 21-48 48v43H46Z M36 150h160v22H36z M190 35l7.5 20.5L218 63l-20.5 7.5L190 91l-7.5-20.5L162 63l20.5-7.5L190 35Z"/></symbol>
      <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
      <symbol id="back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    </defs></svg>
    <a href="#main" class="skip">跳至正文</a>
    <header class="launch-header"><div class="mast-inner">
      <a href="website.html" class="brand" aria-label="星桥官网首页"><svg class="brand-mark" aria-hidden="true"><use href="#bridge"/></svg><b>星桥</b><span>STARBRIDGE</span></a>
      <a class="launch-back" href="website.html"><svg class="icon" aria-hidden="true"><use href="#back"/></svg> 返回官网</a>
    </div></header>
    <main id="main" class="launch-main">
      <header class="launch-heading"><h1>选择工作台</h1><p>选择本次工作的空间，进入后可从侧栏切换。</p></header>
      <div class="workspace-choices">
        <a class="choice choice-film" href="studio.html?view=projects" aria-label="进入星桥娱乐创作工作台">
          <div class="choice-image"><img src="assets/film.webp" alt="镜头与时间线制作台的静物"/><div class="edge-mark" aria-hidden="true"></div></div>
          <div class="choice-copy"><div class="choice-sub">STARBRIDGE STUDIO</div><h2>星桥娱乐</h2><p>从剧本、角色和分镜，制作多角色配音短片。</p><span class="choice-action">进入创作台 <svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></span></div>
        </a>
        <a class="choice choice-office" href="office.html" aria-label="进入星桥办公工作台">
          <div class="choice-image"><img src="assets/paper.webp" alt="文具、纸张与经营简报的桌面静物"/><div class="paper-edge" aria-hidden="true"></div></div>
          <div class="choice-copy"><div class="choice-sub">STARBRIDGE OFFICE</div><h2>星桥办公</h2><p>在对话中核对资料，交付可编辑的文档、表格和简报。</p><span class="choice-action">进入办公台 <svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></span></div>
        </a>
      </div>
    </main>
  </body>
</html>
