<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>星桥办公 · 工作台设计样稿</title>
    <link rel="stylesheet" href="office.css" />
  </head>
  <body>
    <!-- 所有图标均为示意稿内置线稿，不依赖远程图标字体。 -->
    <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-bridge" viewBox="26 20 202 202">
          <path fill="currentColor" stroke="none"
            d="M46 188v-43c0-40 30-70 70-70s70 30 70 70v43h-22v-43c0-27-21-48-48-48s-48 21-48 48v43H46Z M36 150h160v22H36z M190 35l7.5 20.5L218 63l-20.5 7.5L190 91l-7.5-20.5L162 63l20.5-7.5L190 35Z"
          />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7" />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <path
            d="M20 15a3 3 0 0 1-3 3H9l-5 3v-5a3 3 0 0 1-1-2V7a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3zM7 9h9M7 13h6"
          />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path d="M3 7V5h7l2 3h9v12H3z" />
        </symbol>
        <symbol id="i-device" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M12 17v3m-4 0h8" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3" />
          <path d="M5 20c0-7 14-7 14 0" />
        </symbol>
        <symbol id="i-switch" viewBox="0 0 24 24">
          <path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4 4-4-4 4-4" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path d="m9 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l8-8" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M4 12h15m-6-6 6 6-6 6" />
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path d="m6 9 6 6 6-6" />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8m-8 4h6" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18M3 15h18M9 3v18" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="m9 5 7 7-7 7" />
        </symbol>
        <symbol id="i-panel" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M10 4v16" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.5" />
          <path
            d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"
          />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18" />
          <circle cx="8" cy="6" r="2" />
          <circle cx="16" cy="12" r="2" />
          <circle cx="10" cy="18" r="2" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-send" viewBox="0 0 24 24">
          <path d="M12 20V4m-6 6 6-6 6 6" />
        </symbol>
      </defs>
    </svg>
    <div class="shell">
      <aside class="rail" id="navigation">
        <a class="brand" href="office.html"
          ><span class="brand-mark"
            ><svg><use href="#i-bridge" /></svg></span
          ><span>星桥办公<small>STARBRIDGE OFFICE</small></span></a
        >
        <nav aria-label="办公导航">
          <p class="nav-label">办公工作台</p>
          <a class="nav-item" data-nav="home" href="office.html"
            ><svg><use href="#i-home" /></svg>工作首页</a
          >
          <a class="nav-item" data-nav="chat" href="?view=chat"
            ><svg><use href="#i-chat" /></svg>智能对话</a
          >
          <button class="nav-item" data-action="history">
            <svg><use href="#i-clock" /></svg>历史会话
          </button>
          <button class="nav-item" data-action="files">
            <svg><use href="#i-folder" /></svg>我的文件
          </button>
          <button class="nav-item" data-action="devices">
            <svg><use href="#i-device" /></svg>我的设备
          </button>
          <div class="admin-nav" hidden>
            <p class="nav-label">平台管理</p>
            <a class="nav-item active" href="?view=admin"
              ><svg><use href="#i-settings" /></svg>供应商与模型</a
            >
          </div>
          <p class="nav-label">个人中心</p>
          <button class="nav-item" data-action="account">
            <svg><use href="#i-user" /></svg>账号资料
          </button>
        </nav>
        <footer class="rail-footer">
          <div class="identity">
            <span class="avatar" aria-hidden="true">林</span
            ><span
              >林予<small id="role-caption">办公用户 · 样例账号</small></span
            >
          </div>
          <a id="role-link" href="?view=admin"
            >查看管理员样稿 <span aria-hidden="true">↗</span></a
          >
        </footer>
      </aside>
      <button
        class="rail-backdrop"
        aria-label="关闭导航"
        data-action="menu"
      ></button>
      <div class="body">
        <header class="topbar">
          <div class="breadcrumbs">
            <button
              class="icon-button mobile-menu"
              data-action="menu"
              aria-label="展开导航"
            >
              <svg><use href="#i-panel" /></svg></button
            ><a href="office.html">星桥办公</a><i>/</i
            ><b id="crumb">工作首页</b>
          </div>
          <div class="top-actions">
            <button
              class="icon-button"
              data-action="theme"
              aria-label="切换明暗主题"
              title="切换明暗主题"
            >
              <svg><use href="#i-sun" /></svg></button
            ><span class="separator"></span
            ><a href="launch.html"
              ><svg><use href="#i-switch" /></svg>切换系统</a
            >
          </div>
        </header>
        <main class="main" id="main"></main>
        <footer class="sample-note">交互样稿 · 仅使用本地示例数据</footer>
      </div>
    </div>
    <dialog id="overlay">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button class="icon-button" data-action="close" aria-label="关闭窗口">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <input type="file" id="attachment" hidden />
    <div class="announce" id="notice" role="status" aria-live="polite"></div>
    <script>
      const icon = (name) =>
        '<svg aria-hidden="true"><use href="#i-' + name + '"/></svg>'
      const q = (selector) => document.querySelector(selector)
      const main = q('#main')
      const dialog = q('#overlay')
      const params = new URLSearchParams(location.search)
      const view = ['chat', 'admin'].includes(params.get('view'))
        ? params.get('view')
        : 'home'
      const state = {
        file: '',
        device: '服务端 Agent',
        agent: '通用对话',
        model: '默认模型',
        access: '默认权限',
        filter: '',
        size: 4,
        page: 1,
      }
      let noticeTimer
      const draftKey = 'starbridge-office-design-prompt'
      function storedPrompt() {
        try {
          return sessionStorage.getItem(draftKey) || ''
        } catch {
          return ''
        }
      }
      function rememberPrompt(value) {
        try {
          sessionStorage.setItem(draftKey, value)
        } catch {}
      }
      function esc(value) {
        const span = document.createElement('span')
        span.textContent = value
        return span.innerHTML.replaceAll('"', '&quot;')
      }
      function notify(message) {
        q('#notice').textContent = message
        q('#notice').classList.add('show')
        clearTimeout(noticeTimer)
        noticeTimer = setTimeout(
          () => q('#notice').classList.remove('show'),
          2700,
        )
      }
      function openDialog(title, html) {
        q('#dialog-title').textContent = title
        q('#dialog-content').innerHTML = html
        if (!dialog.open) dialog.showModal()
      }
      const models = [
        {
          name: '办公通用对话',
          id: 'office-chat',
          provider: '办公示例连接',
          on: true,
          def: true,
        },
        {
          name: '复杂文档分析',
          id: 'document-reasoning',
          provider: '办公示例连接',
          on: true,
          def: false,
        },
        {
          name: '长文整理',
          id: 'long-context',
          provider: '长文本示例连接',
          on: true,
          def: false,
        },
        {
          name: '快速问答',
          id: 'fast-response',
          provider: '备用示例连接',
          on: false,
          def: false,
        },
      ]
      const sessions = [
        ['第三季度经营简报', '销售明细.csv', '已交付', '10:42'],
        ['华东门店复盘', '门店经营周报.pdf', '待确认', '昨天'],
        ['供应商会议纪要', '采购例会记录.txt', '草稿', '周一'],
      ]
      function fileBadge(type) {
        return (
          '<span class="file-badge ' +
          (type === 'CSV' ? 'green' : '') +
          '">' +
          type +
          '</span>'
        )
      }
      function sourceTable() {
        return '<table class="source-table"><thead><tr><th>月份</th><th>销售额（万元）</th></tr></thead><tbody><tr><td>7 月</td><td>38.6</td></tr><tr><td>8 月</td><td>41.6</td></tr><tr><td>9 月</td><td>48.4</td></tr><tr><th>合计</th><th>128.6</th></tr></tbody></table>'
      }
      function report() {
        return '<section class="report-sheet"><div class="sheet-meta"><span>销售分析</span><span>Q3 / 07—09</span></div><h3>第三季度<br>经营简报</h3><div class="sheet-metric"><b>128.6</b><span>万元<br>季度销售额</span></div><div class="bars" aria-label="7月38.6万元、8月41.6万元、9月48.4万元"><div style="--h:70.2%"><b>38.6</b><span>7 月</span></div><div style="--h:75.6%"><b>41.6</b><span>8 月</span></div><div style="--h:88%"><b>48.4</b><span>9 月</span></div></div><div class="sheet-source">资料来源：销售明细.csv</div></section>'
      }
      function composer(wide) {
        return (
          '<form class="composer ' +
          (wide ? 'home-compose' : 'chat-compose') +
          '" id="task-form"><textarea aria-label="办公任务" id="task" rows="2" placeholder="' +
          (wide ? '描述任务，或添加资料开始……' : '继续询问这份简报……') +
          '"></textarea><div id="file-name"></div><div class="composer-tools"><div class="selector-row"><button type="button" class="icon-button" data-action="attach" title="添加资料" aria-label="添加资料">' +
          icon('link') +
          '</button><span class="separator"></span><button type="button" data-action="settings" class="selector"><i class="dot"></i><span id="device-name">服务端 Agent</span>' +
          icon('down') +
          '</button><button type="button" class="selector secondary" data-action="settings">通用对话 ' +
          icon('down') +
          '</button><button type="button" class="selector secondary" data-action="settings">默认模型 ' +
          icon('down') +
          '</button><button type="button" class="selector secondary" data-action="settings">默认权限 ' +
          icon('down') +
          '</button><button type="button" data-action="settings" class="selector narrow-selector" aria-label="会话设置">' +
          icon('settings') +
          '</button></div><button aria-label="发送示例任务" class="send">' +
          icon('send') +
          '</button></div></form>'
        )
      }
      function sessionRows() {
        return sessions
          .map(
            ([name, file, status, time], i) =>
              '<button class="session-row" data-action="session" data-index="' +
              i +
              '"><span class="session-icon">' +
              icon('chat') +
              '</span><span class="session-text"><strong>' +
              name +
              '</strong><small>' +
              file +
              '</small></span><span class="session-state state-' +
              i +
              '"><i></i>' +
              status +
              '</span><time>' +
              time +
              '</time>' +
              icon('chevron') +
              '</button>',
          )
          .join('')
      }
      function home() {
        main.innerHTML =
          '<div class="home-grid"><section class="intro"><div class="intro-kicker"><span></span>我的工作台</div><h1>今天要完成<br class="desktop-break">什么工作？</h1>' +
          composer(true) +
          '<button class="suggestion" data-action="sample">' +
          icon('file') +
          ' 用销售明细生成季度简报 ' +
          icon('arrow') +
          '</button></section><section class="feature"><div class="feature-head"><span>最近交付</span><span class="feature-tag">DOCX</span></div><button class="feature-art" data-action="report" aria-label="预览第三季度经营简报">' +
          report() +
          '</button><div class="feature-foot"><div><strong>第三季度经营简报.docx</strong><small>经营分析项目 · 今天 10:42</small></div><button class="open-arrow" data-action="report" aria-label="打开最近交付物">' +
          icon('arrow') +
          '</button></div></section><section class="recent"><div class="section-heading"><h2>最近会话</h2><button data-action="history">查看全部 ' +
          icon('arrow') +
          '</button></div><div>' +
          sessionRows() +
          '</div></section></div>'
        q('#task').value = storedPrompt()
      }
      function chat() {
        main.innerHTML =
          '<div class="page-heading"><div><p class="intro-kicker"><span></span>经营分析项目</p><h1>第三季度经营简报</h1></div><button class="outline" data-action="toggle-report" aria-expanded="true">' +
          icon('panel') +
          ' 成果预览</button></div><div class="chat-grid" id="chat-grid"><section class="conversation"><div class="chat-transcript" id="transcript"><article class="message"><div class="message-label"><span class="mini-avatar">林</span>林予 <time>10:39</time></div><p>根据销售明细整理第三季度经营简报，按月汇总销售额，并注明数据来源。</p><button class="inline-file" data-action="source">' +
          fileBadge('CSV') +
          ' 销售明细.csv</button></article><article class="message"><div class="message-label"><span class="mini-avatar agent-mark">' +
          icon('bridge') +
          '</span>办公助手 <time>10:42</time></div><p>第三季度销售额合计 <strong>128.6 万元</strong>。9 月为本季最高，销售额 48.4 万元。</p><button class="text-link" data-action="source">核对 7—9 月明细 ' +
          icon('arrow') +
          '</button><button class="delivery" data-action="report">' +
          fileBadge('DOCX') +
          '<span><b>第三季度经营简报.docx</b><small>经营分析 · 预览文档</small></span>' +
          icon('chevron') +
          '</button></article></div>' +
          composer(false) +
          '</section><aside class="preview" id="inline-preview"><div class="panel-title"><strong>成果预览</strong><button aria-label="收起成果预览" class="icon-button" data-action="toggle-report">' +
          icon('close') +
          '</button></div>' +
          report() +
          '<button class="source-link" data-action="source">' +
          icon('grid') +
          ' 查看原始数据 ' +
          icon('arrow') +
          '</button></aside></div>'
      }
      function admin() {
        main.innerHTML =
          '<section class="admin-page"><div class="page-heading"><h1>聊天模型</h1><span class="mode-label">平台管理员样稿</span></div><form class="filterbar" id="filter-form"><label class="sr" for="search">搜索配置名称或模型 ID</label><input id="search" type="search" placeholder="搜索配置名称或模型 ID"><button type="button" class="primary" data-action="add">新增配置</button><button type="button" class="outline" data-action="providers">供应商连接</button></form><div class="admin-table-scroll"><table class="admin-table"><thead><tr><th>配置 / 供应商</th><th>能力 / 模型</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="range"></span><div><label>每页 <select id="size"><option value="4">4</option><option value="2">2</option><option value="10">10</option></select></label><button data-action="prev">上一页</button><span id="page"></span><button data-action="next">下一页</button></div></div></section>'
        q('#filter-form').onsubmit = (e) => e.preventDefault()
        q('#search').oninput = (e) => {
          state.filter = e.target.value
          state.page = 1
          renderRows()
        }
        q('#size').onchange = (e) => {
          state.size = Number(e.target.value)
          state.page = 1
          renderRows()
        }
        renderRows()
      }
      function renderRows() {
        const list = models.filter((m) =>
          (m.name + m.id)
            .toLowerCase()
            .includes(state.filter.trim().toLowerCase()),
        )
        const pages = Math.max(1, Math.ceil(list.length / state.size))
        state.page = Math.min(pages, Math.max(1, state.page))
        const begin = (state.page - 1) * state.size
        q('#rows').innerHTML =
          list
            .slice(begin, begin + state.size)
            .map(
              (m) =>
                '<tr><td data-label="配置 / 供应商"><b>' +
                esc(m.name) +
                '</b><small>' +
                m.provider +
                '</small></td><td data-label="能力 / 模型">聊天与工具调用<small>' +
                esc(m.id) +
                '</small></td><td data-label="状态"><span class="status-chip ' +
                (!m.on ? 'off' : '') +
                '">' +
                (m.on ? '启用' : '停用') +
                '</span>' +
                (m.def ? '<small>默认配置</small>' : '') +
                '</td><td data-label="操作" class="actions">' +
                ['edit', 'test', 'default']
                  .map(
                    (a, i) =>
                      '<button data-action="' +
                      a +
                      '" data-index="' +
                      models.indexOf(m) +
                      '" ' +
                      (a === 'default' && !m.on ? 'disabled' : '') +
                      '>' +
                      ['编辑', '只读检测', m.def ? '清除默认' : '设为默认'][i] +
                      '</button>',
                  )
                  .join('') +
                '</td></tr>',
            )
            .join('') || '<tr><td colspan="4">没有匹配的配置。</td></tr>'
        q('#range').textContent = list.length
          ? '共 ' +
            list.length +
            ' 条 · ' +
            (begin + 1) +
            '–' +
            Math.min(begin + state.size, list.length)
          : '共 0 条'
        q('#page').textContent = state.page + ' / ' + pages
        q('[data-action=prev]').disabled = state.page === 1
        q('[data-action=next]').disabled = state.page >= pages
      }
      function settings() {
        const fields = [
          ['device', '执行设备', ['服务端 Agent']],
          ['agent', '业务智能体', ['通用对话', '经营简报助手']],
          ['model', '模型', ['默认模型', '办公对话示例']],
          ['access', '权限', ['默认权限', '只读权限']],
        ]
        openDialog(
          '会话设置',
          '<form id="settings-form" class="form-fields">' +
            fields
              .map(
                ([key, title, opts]) =>
                  '<label>' +
                  title +
                  '<select name="' +
                  key +
                  '">' +
                  opts
                    .map(
                      (v) =>
                        '<option ' +
                        (state[key] === v ? 'selected' : '') +
                        '>' +
                        v +
                        '</option>',
                    )
                    .join('') +
                  '</select></label>',
              )
              .join('') +
            '<button class="primary">应用设置</button></form>',
        )
        q('#settings-form').onsubmit = (e) => {
          e.preventDefault()
          Object.assign(state, Object.fromEntries(new FormData(e.target)))
          q('#device-name').textContent = state.device
          document
            .querySelectorAll('.selector.secondary')
            .forEach(
              (el, i) =>
                (el.innerHTML =
                  esc([state.agent, state.model, state.access][i]) +
                  ' ' +
                  icon('down')),
            )
          dialog.close()
          notify('当前样稿设置已更新')
        }
      }
      function editModel(index) {
        const m = models[index]
        openDialog(
          m ? '编辑配置' : '新增配置',
          '<form class="form-fields" id="editor"><label>配置名称<input name="name" required maxlength="40" value="' +
            esc(m?.name || '') +
            '"></label><label>模型 ID<input name="id" required maxlength="64" value="' +
            esc(m?.id || '') +
            '"></label><label>状态<select name="enabled"><option value="1">启用</option><option value="0" ' +
            (m && !m.on ? 'selected' : '') +
            '>停用</option></select></label><button class="primary">保存至样稿</button></form>',
        )
        q('#editor').onsubmit = (e) => {
          e.preventDefault()
          const f = new FormData(e.target)
          const name = f.get('name').trim(),
            id = f.get('id').trim()
          if (!name || !id) return
          const on = f.get('enabled') === '1'
          if (m) {
            Object.assign(m, { name, id, on })
            if (!on) m.def = false
          } else {
            models.unshift({
              name,
              id,
              on,
              provider: '办公示例连接',
              def: false,
            })
            state.page = 1
            state.filter = ''
            q('#search').value = ''
          }
          dialog.close()
          renderRows()
          notify('已更新本地示例')
        }
      }
      function runExample() {
        const value = q('#task').value.trim()
        if (!value) {
          q('#task').focus()
          notify('请先填写任务，或选用季度简报示例')
          return
        }
        if (view === 'home') {
          openDialog(
            '查看任务示例',
            '<p>试用固定的季度简报流程。草稿仅保存在当前标签页，附件不会上传。</p><a class="primary" href="?view=chat">打开季度简报示例 ' +
              icon('arrow') +
              '</a>',
          )
          return
        }
        const node = document.createElement('article')
        node.className = 'message'
        node.innerHTML =
          '<div class="message-label"><span class="mini-avatar">林</span>林予</div><p>' +
          esc(value) +
          '</p><p class="demo-reply">本地示例已记录本条输入。可在成果预览中核对明细。</p>'
        q('#transcript').appendChild(node)
        q('#task').value = ''
        q('#transcript').scrollTop = q('#transcript').scrollHeight
        notify('已写入当前示例会话')
      }
      const handlers = {
        theme() {
          document.documentElement.classList.toggle('night')
        },
        menu() {
          document.body.classList.toggle('rail-open')
        },
        close() {
          dialog.close()
        },
        attach() {
          q('#attachment').click()
        },
        settings,
        sample() {
          q('#task').value =
            '根据销售明细整理第三季度经营简报，并按月列出销售额。'
          rememberPrompt(q('#task').value)
          q('#task').focus()
        },
        history() {
          openDialog('历史会话', '<div>' + sessionRows() + '</div>')
        },
        files() {
          openDialog(
            '我的文件',
            '<button class="file-list" data-action="report">' +
              fileBadge('DOCX') +
              ' 第三季度经营简报.docx ' +
              icon('chevron') +
              '</button><button class="file-list" data-action="source">' +
              fileBadge('CSV') +
              ' 销售明细.csv ' +
              icon('chevron') +
              '</button>',
          )
        },
        devices() {
          openDialog(
            '我的设备',
            '<div class="fact"><span>服务端 Agent</span><strong>示例已就绪</strong></div>',
          )
        },
        account() {
          openDialog(
            '账号资料',
            '<div class="fact"><span>显示名称</span><strong>林予</strong></div><div class="fact"><span>当前视角</span><strong>' +
              (view === 'admin' ? '平台超级管理员' : '办公用户') +
              '</strong></div>',
          )
        },
        session(i) {
          if (i === 0) {
            location.href = '?view=chat'
            return
          }
          const s = sessions[i]
          openDialog(
            s[0],
            '<div class="fact"><span>关联资料</span><b>' +
              s[1] +
              '</b></div><div class="fact"><span>状态</span><b>' +
              s[2] +
              '</b></div>',
          )
        },
        report() {
          openDialog(
            '第三季度经营简报.docx',
            report() +
              '<button class="source-link" data-action="source">' +
              icon('grid') +
              ' 核对销售明细 ' +
              icon('arrow') +
              '</button>',
          )
        },
        source() {
          openDialog('销售明细.csv', sourceTable())
        },
        'toggle-report'() {
          const pane = q('#inline-preview')
          const hidden = !pane.hidden
          pane.hidden = hidden
          q('#chat-grid').classList.toggle('without-preview', hidden)
          q('.page-heading [data-action="toggle-report"]').setAttribute(
            'aria-expanded',
            String(!hidden),
          )
          if (!hidden && matchMedia('(max-width: 800px)').matches)
            pane.scrollIntoView({ block: 'start' })
        },
        providers() {
          openDialog(
            '供应商连接',
            ['办公示例连接', '长文本示例连接', '备用示例连接']
              .map(
                (v) =>
                  '<div class="fact"><span>' +
                  v +
                  '</span><small>本地示例</small></div>',
              )
              .join(''),
          )
        },
        edit: editModel,
        add() {
          editModel(-1)
        },
        test(i) {
          openDialog(
            '只读检测',
            '<p>“' +
              esc(models[i].name) +
              '”的名称、模型 ID 和连接信息齐全。本地演示仅检查字段，未请求真实供应商。</p>',
          )
        },
        default(i) {
          const next = !models[i].def
          models.forEach((m) => (m.def = false))
          models[i].def = next
          renderRows()
          notify('本地默认配置已更新')
        },
        prev() {
          state.page--
          renderRows()
        },
        next() {
          state.page++
          renderRows()
        },
      }
      document.addEventListener('click', (e) => {
        const button = e.target.closest('[data-action]')
        if (!button) return
        if (button.closest('.rail') && innerWidth < 801)
          document.body.classList.remove('rail-open')
        handlers[button.dataset.action]?.(Number(button.dataset.index))
      })
      dialog.addEventListener('click', (e) => {
        if (e.target === dialog) {
          const r = dialog.getBoundingClientRect()
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            dialog.close()
        }
      })
      q('#attachment').onchange = (e) => {
        const file = e.target.files[0]
        if (file) {
          state.file = file.name
          q('#file-name').textContent =
            '已选择：' + file.name + '（仅显示文件名）'
        }
      }
      document.addEventListener('submit', (e) => {
        if (e.target.id === 'task-form') {
          e.preventDefault()
          runExample()
        }
      })
      if (view === 'home') home()
      else if (view === 'chat') chat()
      else admin()
      q('#crumb').textContent =
        view === 'home'
          ? '工作首页'
          : view === 'chat'
            ? '智能对话'
            : '供应商与模型'
      q('[data-nav="' + view + '"]')?.setAttribute('aria-current', 'page')
      if (view === 'admin') {
        q('.admin-nav').hidden = false
        q('#role-caption').textContent = '平台超级管理员 · 样例账号'
        q('#role-link').textContent = '返回办公用户样稿 ↗'
        q('#role-link').href = 'office.html'
      }
      if (view === 'home')
        q('#task').addEventListener('input', (e) =>
          rememberPrompt(e.target.value),
        )
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') document.body.classList.remove('rail-open')
        if (
          e.key === 'Enter' &&
          (e.ctrlKey || e.metaKey) &&
          e.target?.id === 'task'
        )
          runExample()
      })
    </script>
  </body>
</html>
