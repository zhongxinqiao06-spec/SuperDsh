name: starbridge

services:
  config-init:
    build:
      context: .
      dockerfile: apps/admin/deployment/Dockerfile
      target: configuration
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - config-data:/data/config
      - postgres-data:/var/lib/postgresql/data:ro

  platform:
    build:
      context: .
      dockerfile: apps/admin/deployment/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - '${SUPERDSH_BIND_ADDRESS:-0.0.0.0}:${SUPERDSH_HTTP_PORT:-5174}:5174'
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_HOST: postgres
      POSTGRES_USER: agents_anywhere
      POSTGRES_DB: agents_anywhere
      POSTGRES_PASSWORD_FILE: /data/config/postgres-password
      AGENT_SERVER_REDIS_URL: redis://redis:6379/0
      SUPERDSH_QDRANT_URL: http://qdrant:6333
      AGENT_SERVER_PUBLIC_ORIGIN: ${SUPERDSH_PUBLIC_ORIGIN:-}
      AGENT_SERVER_CORS_ORIGINS: ${SUPERDSH_CORS_ORIGINS:-}
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:-}
      SUPERDSH_MODEL_ENCRYPTION_KEY: ${SUPERDSH_MODEL_ENCRYPTION_KEY:-}
      SUPERDSH_INITIAL_ADMIN_USERNAME: ${SUPERDSH_INITIAL_ADMIN_USERNAME:-admin}
      SUPERDSH_INITIAL_ADMIN_PASSWORD: ${SUPERDSH_INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - config-data:/data/config
      - platform-data:/data/runtime
      - files-data:/data/files
    depends_on:
      config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/api/v2/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents_anywhere
      POSTGRES_USER: agents_anywhere
      POSTGRES_PASSWORD_FILE: /run/starbridge-config/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - config-data:/run/starbridge-config:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agents_anywhere -d agents_anywhere']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r line <&3 && [[ "$$line" == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20

volumes:
  config-data:
  platform-data:
  files-data:
  postgres-data:
  redis-data:
  qdrant-data:
