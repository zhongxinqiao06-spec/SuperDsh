name: starbridge

# 固定模型摘要也作为知识库索引的版本号，初始化和平台必须使用相同配置。
x-embedding: &embedding >-
  {"model":"quentinz/bge-small-zh-v1.5:q8_0","revision":"40f5d717a8c0d9b1eedced30ff7460f27fbb7414fd0f2559160d74ccd04a82c9","dimensions":512,"baseUrl":"http://ollama:11434/v1"}

services:
  config-init:
    build:
      context: .
      dockerfile: apps/admin/deployment/Dockerfile
      target: configuration
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - config-data:/data/config
      - postgres-data:/var/lib/postgresql/data:ro
      - minio-data:/minio-data

  platform:
    build:
      context: .
      dockerfile: apps/admin/deployment/Dockerfile
      target: runtime
      args:
        SUPERDSH_BUNDLE_LOCAL_EMBEDDING: '0'
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - '${SUPERDSH_BIND_ADDRESS:-0.0.0.0}:${SUPERDSH_HTTP_PORT:-5174}:5174'
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_HOST: postgres
      POSTGRES_USER: agents_anywhere
      POSTGRES_DB: agents_anywhere
      POSTGRES_PASSWORD_FILE: /data/config/postgres-password
      AGENT_SERVER_REDIS_URL: redis://redis:6379/0
      SUPERDSH_QDRANT_URL: http://qdrant:6333
      SUPERDSH_KNOWLEDGE_EMBEDDING_DEFAULT: *embedding
      SUPERDSH_KNOWLEDGE_EMBEDDING_TRUSTED_ORIGINS: http://ollama:11434${SUPERDSH_KNOWLEDGE_EMBEDDING_TRUSTED_ORIGINS:+,}${SUPERDSH_KNOWLEDGE_EMBEDDING_TRUSTED_ORIGINS:-}
      SUPERDSH_PERSONAL_MODEL_ALLOWED_ORIGINS: http://ollama:11434${SUPERDSH_PERSONAL_MODEL_ALLOWED_ORIGINS:+,}${SUPERDSH_PERSONAL_MODEL_ALLOWED_ORIGINS:-}
      SUPERDSH_EMBEDDING_MODEL_DIR: /data/runtime/models/bge-small-zh-v1.5
      AGENT_SERVER_PUBLIC_ORIGIN: ${SUPERDSH_PUBLIC_ORIGIN:-}
      AGENT_SERVER_CORS_ORIGINS: ${SUPERDSH_CORS_ORIGINS:-}
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:-}
      SUPERDSH_MODEL_ENCRYPTION_KEY: ${SUPERDSH_MODEL_ENCRYPTION_KEY:-}
      SUPERDSH_INITIAL_ADMIN_USERNAME: ${SUPERDSH_INITIAL_ADMIN_USERNAME:-admin}
      SUPERDSH_INITIAL_ADMIN_PASSWORD: ${SUPERDSH_INITIAL_ADMIN_PASSWORD:-admin123}
    volumes:
      - config-data:/data/config
      - platform-data:/data/runtime
      - files-data:/data/files
    depends_on:
      config-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/api/v2/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  postgres:
    image: ${SUPERDSH_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents_anywhere
      POSTGRES_USER: agents_anywhere
      POSTGRES_PASSWORD_FILE: /run/starbridge-config/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - config-data:/run/starbridge-config:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agents_anywhere -d agents_anywhere']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r line <&3 && [[ "$$line" == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20

  minio:
    build:
      context: apps/admin/deployment/minio
    image: superdsh-minio:2025-10-15
    pull_policy: never
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-ec']
    command:
      [
        'export MINIO_ROOT_USER="$$(cat /run/config/minio-root-user)" MINIO_ROOT_PASSWORD="$$(cat /run/config/minio-root-password)"; exec minio server /data --console-address :9001',
      ]
    volumes:
      - config-data:/run/config:ro
      - minio-data:/data
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: superdsh-minio:2025-10-15
    pull_policy: never
    user: '0:0'
    restart: 'no'
    entrypoint: ['/bin/sh', '/usr/local/bin/superdsh-minio-init']
    environment:
      MINIO_CONFIG_DIRECTORY: /run/config
    volumes:
      - config-data:/run/config:ro
    depends_on:
      minio:
        condition: service_healthy

  ollama:
    build:
      context: apps/admin/deployment/ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '512'
      OLLAMA_KEEP_ALIVE: 2m
    mem_limit: 512m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    build:
      context: .
      dockerfile: apps/admin/deployment/Dockerfile
      target: ollama-init
    restart: 'no'
    environment:
      SUPERDSH_KNOWLEDGE_EMBEDDING_DEFAULT: *embedding
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  config-data:
  platform-data:
  files-data:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  ollama-data:
