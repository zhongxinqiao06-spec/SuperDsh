services:
  ollama:
    build:
      context: apps/admin/deployment/ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '512'
      OLLAMA_KEEP_ALIVE: 2m
    mem_limit: 512m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    build:
      context: .
      dockerfile: apps/admin/deployment/Dockerfile
      target: ollama-init
    restart: 'no'
    env_file: apps/admin/deployment/ollama/embedding.env
    depends_on:
      ollama:
        condition: service_healthy
