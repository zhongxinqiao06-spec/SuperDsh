# Keep this project and the service/volume keys to reuse the existing local test data.
name: superdsh-mobile-test

services:
  agent-supervisor:
    build:
      context: ../../..
      dockerfile: apps/server/docker/Dockerfile
      target: agent-supervisor
    image: superdsh-agent-supervisor:local
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      SUPERDSH_AGENT_SUPERVISOR_SECRET: ${SUPERDSH_AGENT_SUPERVISOR_SECRET:-}
      SUPERDSH_SERVER_PROJECT: ${COMPOSE_PROJECT_NAME:-superdsh-mobile-test}
      SUPERDSH_AGENT_IMAGE: ${SUPERDSH_AGENT_IMAGE:-superdsh-agent-runtime:local}
      SUPERDSH_AGENT_SERVER_URL: http://server-next:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - agent-control
    healthcheck:
      test:
        [
          'CMD',
          '/opt/venv/bin/python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
  postgres-next:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents_anywhere
      POSTGRES_USER: agents_anywhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use yarn server:up to create a local env file}
    volumes:
      - agents-anywhere-pg-next:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agents_anywhere -d agents_anywhere']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-next:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '${REDIS_MAXMEMORY:-256mb}',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - agents-anywhere-redis-next:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate-next:
    build:
      context: ../../..
      dockerfile: apps/server/docker/Dockerfile
      target: server
    image: superdsh-server:local
    depends_on:
      postgres-next:
        condition: service_healthy
    environment:
      AGENT_SERVER_DB_BACKEND: postgres
      AGENT_SERVER_DB_URL: postgresql+asyncpg://agents_anywhere:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres-next:5432/agents_anywhere
      AGENT_SERVER_MIGRATION_LOCK_TIMEOUT: ${AGENT_SERVER_MIGRATION_LOCK_TIMEOUT:-120}
      AGENT_SERVER_LOGIN_ALIAS: ${AGENT_SERVER_LOGIN_ALIAS:-}
      AGENT_SERVER_LOGIN_EMAIL: ${AGENT_SERVER_LOGIN_EMAIL:-}
    command:
      [
        'uv',
        'run',
        '--no-sync',
        'python',
        '-m',
        'agent_server.infra.db.migrations',
        'upgrade',
      ]

  server-next:
    image: superdsh-server:local
    restart: unless-stopped
    depends_on:
      agent-supervisor:
        condition: service_healthy
      migrate-next:
        condition: service_completed_successfully
      redis-next:
        condition: service_healthy
    environment:
      AGENT_SERVER_DB_BACKEND: postgres
      AGENT_SERVER_DB_URL: postgresql+asyncpg://agents_anywhere:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres-next:5432/agents_anywhere
      AGENT_SERVER_DB_POOL_SIZE: ${AGENT_SERVER_DB_POOL_SIZE:-10}
      AGENT_SERVER_DB_MAX_OVERFLOW: ${AGENT_SERVER_DB_MAX_OVERFLOW:-20}
      AGENT_SERVER_DB_POOL_TIMEOUT: ${AGENT_SERVER_DB_POOL_TIMEOUT:-30}
      AGENT_SERVER_DB_POOL_RECYCLE: ${AGENT_SERVER_DB_POOL_RECYCLE:-1800}
      AGENT_SERVER_REDIS_URL: redis://redis-next:6379/0
      AGENT_SERVER_REDIS_CONNECT_TIMEOUT: ${AGENT_SERVER_REDIS_CONNECT_TIMEOUT:-5}
      AGENT_SERVER_TIMELINE_REVISION_LEASE_SIZE: ${AGENT_SERVER_TIMELINE_REVISION_LEASE_SIZE:-4096}
      AGENT_SERVER_FILES_BACKEND: local
      AGENT_SERVER_FILES_LOCAL_ROOT: /data/agent-server.files
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:?Set AGENT_SERVER_SECRET}
      SUPERDSH_MODEL_ENCRYPTION_KEY: ${SUPERDSH_MODEL_ENCRYPTION_KEY:-}
      SUPERDSH_PERSONAL_MODEL_ALLOWED_ORIGINS: ${SUPERDSH_PERSONAL_MODEL_ALLOWED_ORIGINS:-}
      SUPERDSH_AGENT_SUPERVISOR_URL: http://agent-supervisor:8090
      SUPERDSH_AGENT_SUPERVISOR_SECRET: ${SUPERDSH_AGENT_SUPERVISOR_SECRET:-}
      SUPERDSH_AGENT_SERVER_URL: http://server-next:8000
      AGENT_SERVER_LOGIN_ALIAS: ${AGENT_SERVER_LOGIN_ALIAS:-}
      AGENT_SERVER_LOGIN_EMAIL: ${AGENT_SERVER_LOGIN_EMAIL:-}
      AGENT_SERVER_PUBLIC_ORIGIN: ${AGENT_SERVER_PUBLIC_ORIGIN:-http://127.0.0.1:15174}
      AGENT_SERVER_CORS_ORIGINS: ${AGENT_SERVER_CORS_ORIGINS:-http://127.0.0.1:15174,http://localhost:15174,http://127.0.0.1:5174}
      FORWARDED_ALLOW_IPS: ${SUPERDSH_TRUSTED_PROXY_IPS:-127.0.0.1}
    volumes:
      - agents-anywhere-files-next:/data
    networks:
      - default
      - agent-control
    ports:
      - '127.0.0.1:${AGENTS_ANYWHERE_WEB_PORT:-15174}:8000'
    healthcheck:
      test:
        [
          'CMD',
          '/opt/venv/bin/python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

volumes:
  agents-anywhere-pg-next:
  agents-anywhere-redis-next:
  agents-anywhere-files-next:

networks:
  agent-control:
    internal: true
