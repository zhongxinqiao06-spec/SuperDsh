# Native API development only: no Docker socket, database, or model credentials.
# The supervisor attaches this relay to each managed Agent's private network.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8000;
    server_name _;
    client_max_body_size 0;

    location /api/v2/ {
      proxy_pass http://host.docker.internal:${SUPERDSH_DEV_API_PORT};
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    location / {
      return 404;
    }
  }
}
