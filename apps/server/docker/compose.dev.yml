# Local development dependencies only. Application processes run on the host.
name: superdsh-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents_anywhere
      POSTGRES_USER: agents_anywhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run yarn server:deps:up}
    ports:
      - '127.0.0.1:${SUPERDSH_DEV_PG_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agents_anywhere -d agents_anywhere']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${SUPERDSH_DEV_REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  agent-api-relay:
    profiles: ['agents']
    image: nginx:1.30.4-trixie
    restart: unless-stopped
    volumes:
      - ./agent-api-relay.conf:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      SUPERDSH_DEV_API_PORT: ${AGENT_SERVER_PORT:-8000}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: '^SUPERDSH_DEV_API_PORT$$'
    networks:
      - agent-relay
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 10s
      timeout: 3s
      retries: 3

  agent-supervisor:
    profiles: ['agents']
    build:
      context: ../../..
      dockerfile: apps/server/docker/Dockerfile
      target: agent-supervisor
    image: superdsh-agent-supervisor:local
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      SUPERDSH_AGENT_SUPERVISOR_SECRET: ${SUPERDSH_AGENT_SUPERVISOR_SECRET:-}
      SUPERDSH_SERVER_PROJECT: superdsh-dev
      SUPERDSH_AGENT_IMAGE: ${SUPERDSH_AGENT_IMAGE:-superdsh-agent-runtime:local}
      SUPERDSH_AGENT_SERVER_URL: http://server-next:8000
      SUPERDSH_AGENT_API_SERVICE: agent-api-relay
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '127.0.0.1:${SUPERDSH_DEV_AGENT_PORT:-18090}:8090'
    networks:
      - agent-control-native
    healthcheck:
      test:
        [
          'CMD',
          '/opt/venv/bin/python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  agent-relay:
  # The native API reaches this loopback-published port. Docker Desktop does
  # not publish ports for a container attached only to an internal network.
  # No worker or API relay is attached to this separate control network.
  agent-control-native:

volumes:
  postgres-data:
  redis-data:
