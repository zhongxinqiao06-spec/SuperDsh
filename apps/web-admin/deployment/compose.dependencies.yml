name: superdsh-web-admin-dev
services:
  postgres:
    image: ${WEB_ADMIN_IMAGE_POSTGRES:?Use web-admin command}
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_admin
      POSTGRES_USER: web_admin
      POSTGRES_PASSWORD: ${WEB_ADMIN_POSTGRES_PASSWORD:?Missing generated configuration}
    ports: ['127.0.0.1:${WEB_ADMIN_POSTGRES_PORT}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U web_admin -d web_admin']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: ${WEB_ADMIN_IMAGE_REDIS:?Use web-admin command}
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --requirepass,
        '${WEB_ADMIN_REDIS_PASSWORD}',
      ]
    ports: ['127.0.0.1:${WEB_ADMIN_REDIS_PORT}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, -a, '${WEB_ADMIN_REDIS_PASSWORD}', ping]
      interval: 3s
      timeout: 3s
      retries: 20
  qdrant:
    restart: unless-stopped
    image: ${WEB_ADMIN_IMAGE_QDRANT:?Use web-admin command}
    environment:
      QDRANT__SERVICE__API_KEY: ${WEB_ADMIN_QDRANT_API_KEY}
    ports: ['127.0.0.1:${WEB_ADMIN_QDRANT_PORT}:6333']
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3;
          read -r protocol status reason <&3;
          test "$$status" = 200
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    pull_policy: never
    restart: unless-stopped
    extends: { file: compose.minio.yml, service: minio }
    environment:
      MINIO_ROOT_PASSWORD: ${WEB_ADMIN_MINIO_PASSWORD}
    ports: ['127.0.0.1:${WEB_ADMIN_MINIO_PORT}:9000']
  minio-init:
    extends: { file: compose.minio.yml, service: minio-init }
    environment:
      MINIO_ROOT_PASSWORD: ${WEB_ADMIN_MINIO_PASSWORD}

  ollama:
    extends: { file: ../../../compose.ollama.yml, service: ollama }
    ports:
      ['127.0.0.1:${WEB_ADMIN_OLLAMA_PORT:?Missing development port}:11434']
  ollama-init:
    extends: { file: ../../../compose.ollama.yml, service: ollama-init }

volumes:
  ollama-data:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
