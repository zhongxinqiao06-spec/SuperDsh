server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_certificate /etc/nginx/ssl/starbridgeagentplatform.com/starbridgeagentplatform.com_bundle.crt;
ssl_certificate_key /etc/nginx/ssl/starbridgeagentplatform.com/starbridgeagentplatform.com.key;
ssl_session_cache shared:StarbridgeTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name starbridgeagentplatform.com www.starbridgeagentplatform.com;
    return 308 https://starbridgeagentplatform.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.starbridgeagentplatform.com;
    return 308 https://starbridgeagentplatform.com$request_uri;
}

server {
    listen 443 ssl;
    server_name starbridgeagentplatform.com;
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_buffering off;

    # Docker 重建服务后重新解析容器地址；API 和 WebSocket 直接接收外部 HTTPS 协议。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend fronted:8080;
    set $api backend:8001;
    location ~ ^/(api|ws|health)(/|$) {
        proxy_pass http://$api;
    }
    location / {
        proxy_pass http://$frontend;
    }
}
