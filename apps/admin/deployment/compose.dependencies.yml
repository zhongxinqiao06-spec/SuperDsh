# Local development dependencies only. Application processes run on the host.
name: superdsh-dev

services:
  minio:
    build:
      context: ./minio
    image: superdsh-minio:2025-10-15
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SUPERDSH_MINIO_ROOT_USER:?Run yarn server:deps:up}
      MINIO_ROOT_PASSWORD: ${SUPERDSH_MINIO_ROOT_PASSWORD:?Run yarn server:deps:up}
    ports:
      - '127.0.0.1:${SUPERDSH_DEV_MINIO_PORT:-19000}:9000'
      - '127.0.0.1:${SUPERDSH_DEV_MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9000/minio/health/ready',
        ]
      interval: 5s
      timeout: 3s
      retries: 15
  minio-init:
    image: superdsh-minio:2025-10-15
    entrypoint: ['/usr/local/bin/superdsh-minio-init']
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${SUPERDSH_MINIO_ROOT_USER:?Run yarn server:deps:up}
      MINIO_ROOT_PASSWORD: ${SUPERDSH_MINIO_ROOT_PASSWORD:?Run yarn server:deps:up}
      SUPERDSH_MINIO_APP_USER: ${SUPERDSH_MINIO_APP_USER:?Run yarn server:deps:up}
      SUPERDSH_MINIO_APP_PASSWORD: ${SUPERDSH_MINIO_APP_PASSWORD:?Run yarn server:deps:up}
    depends_on:
      minio:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents_anywhere
      POSTGRES_USER: agents_anywhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run yarn server:deps:up}
    ports:
      - '127.0.0.1:${SUPERDSH_DEV_PG_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agents_anywhere -d agents_anywhere']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${SUPERDSH_DEV_REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${SUPERDSH_QDRANT_API_KEY:-}
    ports:
      - '127.0.0.1:${SUPERDSH_DEV_QDRANT_PORT:-16333}:6333'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The official Debian image has bash but no curl/wget. Health endpoints
      # do not require the collection API key.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r line <&3 && [[ "$$line" == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  minio-data:
  postgres-data:
  redis-data:
  qdrant-data:
